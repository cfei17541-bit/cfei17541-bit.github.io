    <title>错题本</title>
    <link rel="stylesheet" href="hark.css" />
    <style>
      body { overscroll-behavior-y: none; }
      .x-app { padding: 0 var(--gutter); padding-top: calc(env(safe-area-inset-top) + 64px); padding-bottom: calc(env(safe-area-inset-bottom) + 96px); max-width: 760px; margin: 0 auto; }
      .x-top { position: fixed; inset: 0 0 auto 0; z-index: 20; padding: env(safe-area-inset-top) var(--gutter) 0; background: var(--mat-agent); backdrop-filter: var(--hark-blur); -webkit-backdrop-filter: var(--hark-blur); border-bottom: 1px solid var(--stroke-secondary); }
      .x-top__in { max-width: 760px; margin: 0 auto; height: 56px; display: flex; align-items: center; justify-content: space-between; }
      .x-top h1 { margin: 0; font: var(--type-heading); }
      .x-icon { width: var(--tap); height: var(--tap); border: 0; border-radius: var(--r-pill); background: transparent; color: var(--text-primary); display: grid; place-items: center; cursor: pointer; }
      .x-icon:active { background: var(--hover-wash); }
      .x-menu { position: absolute; right: var(--gutter); top: calc(env(safe-area-inset-top) + 52px); min-width: 180px; padding: 6px; border-radius: var(--r-m); background: var(--fill-primary-on); border: 1px solid var(--stroke-primary); box-shadow: var(--hark-shadow); display: grid; }
      .x-menu[hidden] { display: none; }
      .x-menu button { min-height: var(--tap); text-align: left; padding: 0 12px; border: 0; border-radius: var(--r-s); background: transparent; color: var(--text-primary); font: var(--type-body); cursor: pointer; }
      .x-menu button:active { background: var(--hover-wash); }
      .x-menu .x-danger { color: var(--fill-system-red); }
      .x-banner { margin: 12px 0 0; padding: 10px 14px; border-radius: var(--r-s); background: var(--fill-tertiary); font: var(--type-small); color: var(--text-secondary); display: flex; align-items: center; gap: 10px; }
      .x-banner[hidden] { display: none; }
      .x-banner > span { flex: 1; }
      .x-banner > button { flex: none; min-height: var(--tap); }
      .x-topr { display: flex; align-items: center; gap: 6px; min-width: 0; }
      .x-store { display: inline-flex; align-items: center; gap: 6px; min-height: var(--tap); min-width: 0; padding: 0 10px; border: 0; border-radius: var(--r-pill); background: transparent; color: var(--text-secondary); font: var(--type-caption); cursor: default; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .x-store[hidden] { display: none; }
      .x-store::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--fill-system-green); }
      .x-store.is-warn { color: var(--text-primary); border: 1px solid var(--fill-system-orange); cursor: pointer; }
      .x-store.is-warn::before { background: var(--fill-system-orange); }
      .x-store > span { overflow: hidden; text-overflow: ellipsis; }
      .x-padbar .x-save, .x-padbar .x-save:active { background: var(--fill-primary); color: var(--text-primary-on); border-color: var(--fill-primary); font-weight: var(--weight-bold); padding: 0 16px; }
      .x-savebar { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 72px); z-index: 19; padding: 8px var(--gutter); background: var(--mat-agent); backdrop-filter: var(--hark-blur); -webkit-backdrop-filter: var(--hark-blur); border-top: 1px solid var(--stroke-secondary); }
      .x-savebar .btn { display: flex; width: 100%; max-width: 760px; margin: 0 auto; min-height: 52px; font: var(--type-body); font-weight: var(--weight-bold); }
      body.x-adding .x-app { padding-bottom: calc(env(safe-area-inset-bottom) + 170px); }
      body.x-adding .x-toast { bottom: calc(env(safe-area-inset-bottom) + 150px); }
      .x-tabs { position: fixed; inset: auto 0 0 0; z-index: 20; display: flex; justify-content: center; gap: 4px; padding: 8px var(--gutter) calc(env(safe-area-inset-bottom) + 8px); background: var(--mat-agent); backdrop-filter: var(--hark-blur); -webkit-backdrop-filter: var(--hark-blur); border-top: 1px solid var(--stroke-secondary); }
      .x-tabs button { flex: 1; max-width: 200px; min-height: 48px; border: 0; border-radius: var(--r-pill); background: transparent; color: var(--text-secondary); font: var(--type-label); cursor: pointer; display: grid; place-items: center; gap: 2px; padding: 4px 0; }
      .x-tabs button svg { width: 22px; height: 22px; }
      .x-tabs button[aria-selected="true"] { color: var(--text-primary-on); background: var(--fill-primary); }
      .x-view { display: grid; gap: 16px; padding-top: 16px; }
      .x-view[hidden] { display: none; }
      .x-view h2 { margin: 0; font: var(--type-title); }
      .x-sub { margin: 0; font: var(--type-small); color: var(--text-secondary); }
      .x-field { display: grid; gap: 6px; }
      .x-field > span { font: var(--type-label); }
      .x-in { width: 100%; box-sizing: border-box; min-height: var(--tap); padding: 10px 12px; border-radius: var(--r-s); border: 1px solid var(--stroke-primary); background: var(--fill-primary-on); color: var(--text-primary); font: 16px/1.4 var(--sans); }
      textarea.x-in { min-height: 96px; resize: vertical; }
      .x-in:focus { outline: 2px solid var(--fill-primary); outline-offset: -1px; }
      .x-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .x-panel { display: grid; gap: 14px; padding: 18px; border-radius: var(--r-l); background: var(--fill-tertiary); }
      .x-panel .x-in { background: var(--fill-primary-on); }
      .x-panel h3 { margin: 0; font: var(--type-heading); }
      .x-primary { justify-content: center; min-height: var(--tap); background: var(--fill-primary); color: var(--text-primary-on); border-color: var(--fill-primary); font: var(--type-label); cursor: pointer; }
      button.btn { cursor: pointer; justify-content: center; }
      .x-thumbs { display: flex; flex-wrap: wrap; gap: 8px; }
      .x-thumbs img { width: 72px; height: 72px; object-fit: cover; border-radius: var(--r-s); border: 1px solid var(--stroke-primary); }
      .x-chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
      .x-chips button { flex: none; min-height: var(--tap); min-width: var(--tap); padding: 0 14px; border-radius: var(--r-pill); border: 1px solid var(--stroke-primary); background: var(--fill-primary-on); color: var(--text-primary); font: var(--type-tag); cursor: pointer; }
      .x-chips button[aria-pressed="true"] { background: var(--fill-primary); color: var(--text-primary-on); border-color: var(--fill-primary); }
      .x-list { display: grid; gap: 10px; list-style: none; margin: 0; padding: 0; }
      .x-card { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 14px 16px; border-radius: var(--r-m); border: 0; background: var(--fill-tertiary); color: var(--text-primary); font: var(--type-body); cursor: pointer; }
      .x-card:active { box-shadow: inset 0 0 0 100px var(--hover-wash); }
      .x-card p { margin: 6px 0 0; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
      .x-card img { width: 56px; height: 56px; object-fit: cover; border-radius: var(--r-s); }
      .x-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font: var(--type-caption); color: var(--text-secondary); }
      .x-ok::before { background: var(--fill-system-green) !important; box-shadow: none !important; }
      .x-empty { text-align: center; padding: 40px 0; color: var(--text-secondary); font: var(--type-small); }
      .x-modal { position: fixed; inset: 0; z-index: 40; display: flex; align-items: flex-end; justify-content: center; background: rgb(0 0 0 / 0.4); }
      .x-modal[hidden] { display: none; }
      .x-sheet { width: 100%; max-width: 640px; max-height: 88vh; overflow-y: auto; box-sizing: border-box; padding: 20px var(--gutter) calc(env(safe-area-inset-bottom) + 20px); border-radius: var(--r-l) var(--r-l) 0 0; background: var(--fill-primary-on); display: grid; gap: 14px; animation: x-up var(--dur-quick) var(--ease-out); }
      @media (min-width: 700px) { .x-modal { align-items: center; } .x-sheet { border-radius: var(--r-l); } }
      @keyframes x-up { from { transform: translateY(24px); opacity: 0; } }
      .x-sheet h3 { margin: 0; font: var(--type-heading); }
      .x-q { white-space: pre-wrap; font: var(--size-prose)/1.5 var(--sans); margin: 0; }
      .x-imgs { display: grid; gap: 8px; }
      .x-imgs img { width: 100%; max-height: 50vh; object-fit: contain; border-radius: var(--r-m); background: var(--fill-tertiary); cursor: zoom-in; }
      .x-ans { padding: 14px 16px; border-radius: var(--r-m); background: var(--fill-tertiary); }
      .x-actions { display: flex; gap: 10px; flex-wrap: wrap; }
      .x-actions > * { flex: 1; }
      .x-del { color: var(--fill-system-red); }
      .x-full { position: fixed; inset: 0; z-index: 60; background: #000; display: grid; place-items: center; }
      .x-full[hidden] { display: none; }
      .x-full img { max-width: 100vw; max-height: 100vh; object-fit: contain; }
      .x-flip { perspective: 1400px; }
      .x-flip__in { display: grid; transition: transform 500ms var(--ease-out); transform-style: preserve-3d; }
      .x-flip.is-flipped .x-flip__in { transform: rotateY(180deg); }
      .x-face { grid-area: 1 / 1; backface-visibility: hidden; -webkit-backface-visibility: hidden; min-height: 300px; padding: 22px; border-radius: var(--r-l); background: var(--fill-tertiary); display: flex; flex-direction: column; gap: 14px; box-sizing: border-box; }
      .x-face--back { transform: rotateY(180deg); background: var(--fill-primary-on); border: 1px solid var(--stroke-primary); }
      .x-face .x-imgs img { max-height: 36vh; }
      .x-face .x-grow { flex: 1; }
      @media (prefers-reduced-motion: reduce) { .x-flip__in { transition: none; } }
      .x-rate { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
      .x-rate button { min-height: 56px; flex-direction: column; gap: 2px; font: var(--type-label); }
      .x-rate small { font: var(--type-caption); color: var(--text-secondary); }
      .x-bar { height: 4px; border-radius: var(--r-pill); background: var(--fill-tertiary); overflow: hidden; }
      .x-bar i { display: block; height: 100%; background: var(--fill-primary); transition: width var(--dur-quick) ease; }
      .x-toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 84px); transform: translateX(-50%); z-index: 70; padding: 10px 16px; border-radius: var(--r-pill); background: var(--fill-primary); color: var(--text-primary-on); font: var(--type-label); pointer-events: none; }
      .x-toast[hidden] { display: none; }
      .x-lab { font: var(--type-label); }
      .x-tb { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
      .x-tb::-webkit-scrollbar { display: none; }
      .x-tb button { flex: none; min-width: var(--tap); min-height: var(--tap); padding: 0 10px; border-radius: var(--r-s); border: 1px solid var(--stroke-primary); background: var(--fill-primary-on); color: var(--text-primary); font: var(--type-label); cursor: pointer; }
      .x-tb button:active { box-shadow: inset 0 0 0 100px var(--hover-wash); }
      .x-prev { display: grid; gap: 4px; padding: 10px 12px; border-radius: var(--r-s); border: 1px dashed var(--stroke-primary); background: var(--fill-primary-on); }
      .x-prev .x-q { font: var(--type-body); min-height: 1.4em; overflow-x: auto; }
      .x-prev .x-q:empty::before { content: "输入后在此预览公式"; color: var(--text-secondary); }
      .x-m { white-space: normal; }
      .x-fb { font-family: "Latin Modern Math", "STIX Two Math", "Cambria Math", "Times New Roman", serif; font-size: 1.08em; }
      .x-fb i { font-style: italic; }
      .x-up { font-style: normal; }
      .x-fr { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; font-size: 1em; line-height: 1.2; margin: 0 0.12em; }
      .x-fr > span { padding: 0 0.15em; }
      .x-fr > span:first-child { border-bottom: 1px solid currentColor; }
      .x-fr--n > span:first-child { border-bottom: 0; }
      .x-sq { white-space: nowrap; }
      .x-sq > span:last-child { border-top: 1px solid currentColor; padding: 0.05em 0.1em 0; margin-left: 0.05em; }
      .x-sqn { font-size: 0.8em; margin-right: -0.25em; vertical-align: 0.9em; }
      .x-lim { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.1; margin: 0 0.15em; }
      .x-lim > small { font-size: 0.8em; }
      .x-lim--sup { vertical-align: middle; }
      .x-big { font-size: 1.35em; line-height: 1; }
      .x-int { font-size: 1.5em; line-height: 1; vertical-align: -0.2em; }
      .x-fb sup, .x-fb sub { font-size: 0.8em; line-height: 0; }
      .x-ss { display: inline-flex; flex-direction: column; vertical-align: middle; font-size: 0.8em; line-height: 1.05; }
      .x-rel { margin: 0 0.22em; }
      .x-md { display: block; text-align: center; margin: 0.4em 0; overflow-x: auto; overflow-y: hidden; }
      /* 手写草稿板 */
      .x-pad { display: grid; gap: 10px; min-width: 0; }
      .x-padbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
      .x-padbar button { flex: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: var(--tap); min-height: var(--tap); padding: 0 10px; border-radius: var(--r-s); border: 1px solid var(--stroke-primary); background: var(--fill-primary-on); color: var(--text-primary); font: var(--type-label); cursor: pointer; }
      .x-padbar button:active { box-shadow: inset 0 0 0 100px var(--hover-wash); }
      .x-padbar button[aria-pressed="true"] { background: var(--fill-primary); color: var(--text-primary-on); border-color: var(--fill-primary); }
      .x-padbar button:disabled { opacity: 0.4; cursor: default; }
      .x-sep { width: 1px; height: 24px; background: var(--stroke-secondary); }
      .x-sw { width: 14px; height: 14px; border-radius: 50%; box-shadow: 0 0 0 1.5px #fff; }
      .x-pad__vp { position: relative; overflow: hidden; height: 60vh; min-height: 320px; box-sizing: border-box; border-radius: var(--r-m); border: 1px solid var(--stroke-primary); background: #fff; }
      .x-pad__cv { display: block; width: 100%; height: 100%; background-color: #fff; transform-origin: 0 0; will-change: transform; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; cursor: crosshair; }
      .x-pad--pencil .x-pad__cv { touch-action: pan-x pan-y pinch-zoom; }
      .x-pager { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; }
      .x-pager button { flex: none; min-width: var(--tap); min-height: var(--tap); padding: 0 14px; border-radius: var(--r-pill); border: 1px solid var(--stroke-primary); background: var(--fill-primary-on); color: var(--text-primary); font: var(--type-label); cursor: pointer; }
      .x-pager button:disabled { opacity: 0.4; cursor: default; }
      .x-pager button:active { box-shadow: inset 0 0 0 100px var(--hover-wash); }
      .x-pgno { font: var(--type-label); color: var(--text-secondary); min-width: 88px; text-align: center; font-variant-numeric: tabular-nums; }
      .x-pad__cv.is-flip { animation: x-flip 0.18s ease-out; }
      @keyframes x-flip { from { opacity: 0.25; } to { opacity: 1; } }
      .x-pad--pencil.is-zoomed .x-pad__cv { touch-action: none; }
      .x-past > summary { min-height: var(--tap); display: flex; align-items: center; gap: 8px; cursor: pointer; font: var(--type-label); color: var(--text-primary); list-style: none; }
      .x-past > summary::-webkit-details-marker { display: none; }
      .x-past > summary::before { content: "›"; display: inline-block; width: 12px; transition: transform var(--dur-quick) var(--ease-out); }
      .x-past[open] > summary::before { transform: rotate(90deg); }

            afterJudge();
          }
        });
        $("pPrev").addEventListener("click", function () { var k = pKey(); if (pPos[k] > 0) { pPos[k]--; renderPrac(); $("pRun").scrollIntoView({ block: "start" }); } });
        $("pNext").addEventListener("click", function () {
          var k = pKey(), list = pList();
          if (pPos[k] < list.length - 1) { pPos[k]++; renderPrac(); $("pRun").scrollIntoView({ block: "start" }); return; }
          var f = list.findIndex(function (q) { return !pDone(q); });
          if (f < 0) { $("pSum").scrollIntoView({ behavior: "smooth", block: "center" }); return; }
          pPos[k] = f; renderPrac(); toast("还有 " + list.filter(function (q) { return !pDone(q); }).length + " 题没做，已跳到第 " + (f + 1) + " 题");
        });

        /* ---------- gear menu ---------- */
        var menu = $("menu");
        $("gear").addEventListener("click", function (e) { e.stopPropagation(); menu.hidden = !menu.hidden; this.setAttribute("aria-expanded", String(!menu.hidden)); });
        document.addEventListener("click", function (e) { if (!menu.hidden && !menu.contains(e.target)) { menu.hidden = true; $("gear").setAttribute("aria-expanded", "false"); } });
        menu.addEventListener("click", function (e) {
          var b = e.target.closest("button"); if (!b) return;
          menu.hidden = true;
          var act = b.dataset.act;
          if (act === "export") exportBackup();
          else if (act === "import") { $("backupFile").click(); }
          else if (act === "clear") {
            confirmBox("清空全部 " + cards.length + " 道错题和刷题记录？此操作无法撤销。", "清空", function () { cards = []; prac = {}; dropPPad(); clearDraws(); drafts = {}; persistDrafts(); save(); refresh(); toast("已清空"); });
          }
        });
        function exportBackup() {
          flushPads();
          var outCards = cards.map(function (c) {
            var o = Object.assign({}, c);
            o.attempts = sortedAtts(c).map(function (a) { var b = Object.assign({}, a); if (a.draw && draws[a.id]) b.drawing = draws[a.id]; return b; });
            return o;
          });
          var blob = new Blob([JSON.stringify({ app: "错题本", version: 3, exported: new Date().toISOString(), cards: outCards, practice: pracOut(), drafts: drafts }, null, 1)], { type: "application/json" });
          var a = document.createElement("a");
          a.href = URL.createObjectURL(blob); a.download = "错题本备份-" + new Date().toISOString().slice(0, 10) + ".json";
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
          toast("备份已导出");
        }
        // give the inline manifest this page's address, so 添加到主屏幕 opens here
        try {
          var man = $("manifest"), mj = JSON.parse(decodeURIComponent(man.getAttribute("href").replace(/^data:application\/manifest\+json,/, "")));
          if (/^https?:/.test(location.protocol)) { mj.start_url = location.href.split("#")[0]; mj.scope = location.href.split("#")[0].replace(/[^/]*$/, ""); mj.id = mj.start_url; }
          man.setAttribute("href", "data:application/manifest+json," + encodeURIComponent(JSON.stringify(mj)));
        } catch (e) {}
        $("backupFile").addEventListener("change", function () {
          var f = this.files && this.files[0]; if (!f) return;
          var r = new FileReader();
          r.onload = function () {
            try {
              var d = JSON.parse(r.result), list = Array.isArray(d) ? d : d.cards;
              if (!Array.isArray(list)) throw 0;
              var ids = {}; cards.forEach(function (c) { ids[c.id] = 1; });
              var added = 0;
              list.forEach(function (o) {
                if (!o || (!o.q && !(o.imgs && o.imgs.length))) return;
                var c = Object.assign(mk(o), o); c.subject = normSubj(o.subject); if (!Array.isArray(c.imgs)) c.imgs = [];
                c.attempts = (Array.isArray(o.attempts) ? o.attempts : []).filter(function (a) { return a && typeof a === "object"; }).map(function (a) {
                  var b = { id: a.id || uid(), time: +a.time || Date.now(), result: a.result || "首次", note: a.note || "" };
                  if (a.ans) b.ans = String(a.ans);
                  if (typeof a.drawing === "string" && a.drawing.indexOf("data:image/") === 0) { b.draw = true; putDraw(b.id, a.drawing); }
                  else if (a.draw && draws[b.id]) b.draw = true;
                  return b;
                });
                if (ids[c.id]) cards = cards.filter(function (x) { return x.id !== c.id; }); else added++;
                cards.push(c);
              });
              if (d.practice && typeof d.practice === "object") Object.keys(d.practice).forEach(function (k) {
                var v = d.practice[k]; if (!v || typeof v !== "object") return;
                if (v.att) { if (typeof v.att.drawing === "string" && v.att.drawing.indexOf("data:image/") === 0) { v.att.draw = true; putDraw(v.att.id, v.att.drawing); } delete v.att.drawing; }
                pNorm(v);
                v.atts = v.atts.filter(function (a) { return a && typeof a === "object"; }).map(function (a) {
                  a = Object.assign({}, a); if (!a.id) a.id = uid();
                  if (typeof a.drawing === "string" && a.drawing.indexOf("data:image/") === 0) { a.draw = true; putDraw(a.id, a.drawing); }
                  delete a.drawing; return a;
                });
                var mine = pNorm(prac[k]);
                // the newer copy wins; both keep every attempt either side has
                if (mine && (mine.t || 0) >= (v.t || 0)) { v.atts.forEach(function (a) { if (!mine.atts.some(function (x) { return x.id === a.id; })) mine.atts.push(a); }); return; }
                if (mine) mine.atts.forEach(function (a) { if (!v.atts.some(function (x) { return x.id === a.id; })) v.atts.push(a); });
                prac[k] = v;
              });
              if (d.drafts && typeof d.drafts === "object") {
                Object.keys(d.drafts).forEach(function (k) { var v = d.drafts[k]; if (v && typeof v === "object" && (!drafts[k] || (v.t || 0) > (drafts[k].t || 0))) drafts[k] = v; });
                persistDrafts();
              }
              save(); refresh(); toast("已导入备份（新增 " + added + " 题）");
            } catch (e) { toast("备份文件格式不正确"); }
          };
          r.readAsText(f); this.value = "";
        });
        function refresh() { renderLib(); if (!$("v-rev").hidden) renderRevSetup(); if (!$("v-prac").hidden) renderPrac(); }

        renderLib();
        initDraws();
      })();
    </script>
  </body>
</html>
